name: Build

# Her push'ta release APK + birim testleri. APK, artifact olarak yuklenir.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # Bagimliliklar (2026 AndroidX hatti) compileSdk 37 istiyor. Runner'da
      # hazir olmayabilir; kurulamazsa AGP kendi indirir (best-effort adim).
      - name: Install Android SDK 37 (best effort)
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37" \
            > /dev/null 2>&1 || echo "sdkmanager ile kurulamadi; AGP otomatik indirecek."

      # Release imzalama anahtari base64 secret olarak gelir; repoda TUTULMAZ.
      # Secret yoksa dosya olusmaz, build.gradle.kts debug imzasina duser.
      - name: Decode release keystore
        env:
          HATIR_STORE_BASE64: ${{ secrets.HATIR_STORE_BASE64 }}
        run: |
          if [ -n "$HATIR_STORE_BASE64" ]; then
            printf '%s' "$HATIR_STORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/release.keystore"
            echo "Keystore yazildi: $(stat -c%s "$GITHUB_WORKSPACE/release.keystore") bayt"
          else
            echo "HATIR_STORE_BASE64 yok; release debug anahtariyla imzalanacak."
          fi

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Unit tests
        env:
          HATIR_STORE_FILE: ${{ github.workspace }}/release.keystore
          HATIR_STORE_PASSWORD: ${{ secrets.HATIR_STORE_PASSWORD }}
          HATIR_KEY_ALIAS: ${{ secrets.HATIR_KEY_ALIAS }}
          HATIR_KEY_PASSWORD: ${{ secrets.HATIR_KEY_PASSWORD }}
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest

      - name: Assemble release APK
        env:
          HATIR_STORE_FILE: ${{ github.workspace }}/release.keystore
          HATIR_STORE_PASSWORD: ${{ secrets.HATIR_STORE_PASSWORD }}
          HATIR_KEY_ALIAS: ${{ secrets.HATIR_KEY_ALIAS }}
          HATIR_KEY_PASSWORD: ${{ secrets.HATIR_KEY_PASSWORD }}
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hachi-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: |
            app/build/reports/tests/**
            app/build/test-results/**
          if-no-files-found: ignore
          retention-days: 7
