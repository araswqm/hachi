org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=false

# AGP 9 Kotlin'i kendi içine aldi ("built-in Kotlin") ve yeni bir DSL getirdi.
# Biz klasik `org.jetbrains.kotlin.android` + KGP eklentileri (Compose derleyicisi,
# kotlinx.serialization, KSP, Hilt) duzenini kullaniyoruz; bu duzen yeni DSL ile
# uyumlu degil. Bu iki satir dokumante edilmis uyumluluk yoludur.
# AGP 10'da kaldirilacak -> o zaman built-in Kotlin'e tasinmali.
android.builtInKotlin=false
android.newDsl=false

kotlin.code.style=official
